<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HOURLY KPI CONSULTATION  UNIT II</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800;900&family=JetBrains+Mono:wght@700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-canvas: #f8fafc;
      --navy-deep: #070e1c;
      --navy-card: #0c182d;
      --navy-card-border: #1e2f4d;
      --pink-glow: rgba(244, 114, 182, 0.22);
      --accent-cyan: #38bdf8;
      --accent-emerald: #10b981;
      --accent-rose: #f43f5e;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    body {
      background-color: var(--bg-canvas);
      background-image: 
        radial-gradient(circle at 50% 50px, var(--pink-glow) 0%, rgba(251, 207, 232, 0.1) 40%, transparent 75%),
        linear-gradient(180deg, #ffffff 0%, #f1f5f9 100%);
      background-attachment: fixed;
      color: #0f172a;
      padding: 24px;
      min-height: 100vh;
    }

    .container {
      max-width: 1840px;
      margin: 0 auto;
    }

    /* Top Command Header Bar */
    .top-bar {
      background: rgba(9, 19, 34, 0.92);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(56, 189, 248, 0.25);
      border-radius: 16px;
      padding: 20px 32px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      box-shadow: 0 10px 30px -5px rgba(244, 114, 182, 0.22), 0 8px 20px rgba(7, 14, 28, 0.4);
      margin-bottom: 24px;
    }

    .header-center-content {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      min-width: 320px;
    }

    .luxury-watch-white {
      width: 52px;
      height: 52px;
      background: #ffffff;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.45), 0 0 0 3px #0f274a;
      flex-shrink: 0;
    }

    .luxury-watch-white svg {
      width: 44px;
      height: 44px;
    }

    .main-heading {
      font-size: 29px;
      font-weight: 900;
      color: #ffffff;
      letter-spacing: 0.5px;
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.4);
    }

    .btn-file-upload {
      background: linear-gradient(135deg, #0f274a 0%, #1e3a8a 100%);
      color: #ffffff;
      padding: 12px 26px;
      font-size: 15px;
      font-weight: 800;
      letter-spacing: 0.4px;
      border-radius: 10px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      border: 1px solid #38bdf8;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.2);
      transition: all 0.25s ease;
      white-space: nowrap;
    }

    .btn-file-upload:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(56, 189, 248, 0.45);
      background: linear-gradient(135deg, #1e3a8a 0%, #2563eb 100%);
      border-color: #7dd3fc;
    }

    .btn-file-upload svg {
      width: 20px;
      height: 20px;
      stroke-width: 2.4;
      color: #38bdf8;
    }

    /* KPI Grid */
    .kpi-board {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 16px;
      margin-bottom: 28px;
    }

    .kpi-card-navy {
      background: linear-gradient(145deg, #091426 0%, #0c1b33 100%);
      border: 1px solid var(--navy-card-border);
      border-radius: 14px;
      padding: 20px 22px;
      box-shadow: 0 8px 20px -4px rgba(7, 14, 28, 0.25);
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: center;
      min-height: 108px;
    }

    .kpi-card-navy::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 5px;
      height: 100%;
    }

    .card-cyan::before { background: var(--accent-cyan); box-shadow: 0 0 10px var(--accent-cyan); }
    .card-blue::before { background: #60a5fa; box-shadow: 0 0 10px #60a5fa; }
    .card-purple::before { background: #c084fc; box-shadow: 0 0 10px #c084fc; }
    .card-green::before { background: var(--accent-emerald); box-shadow: 0 0 12px var(--accent-emerald); }
    .card-red::before { background: var(--accent-rose); box-shadow: 0 0 12px var(--accent-rose); }

    .kpi-title {
      font-size: 12px;
      font-weight: 800;
      color: #cbd5e1;
      text-transform: uppercase;
      letter-spacing: 0.9px;
    }

    .kpi-number {
      font-family: 'JetBrains Mono', monospace;
      font-size: 30px;
      font-weight: 900;
      color: #ffffff;
      margin-top: 6px;
      letter-spacing: -0.5px;
    }

    .kpi-agent-name {
      font-size: 19px;
      font-weight: 900;
      margin-top: 6px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .text-best-green {
      color: #34d399;
      text-shadow: 0 0 10px rgba(52, 211, 153, 0.4);
    }

    .text-worst-red {
      color: #fb7185;
      text-shadow: 0 0 10px rgba(251, 113, 133, 0.4);
    }

    /* Team Panels & Data Tables */
    .team-panel {
      background: #ffffff;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      margin-bottom: 26px;
      overflow: hidden;
      box-shadow: 0 6px 18px -3px rgba(15, 23, 42, 0.07);
    }

    .team-title-banner {
      background: linear-gradient(90deg, #070e1c 0%, #0c182d 100%);
      color: #ffffff;
      padding: 12px 22px;
      font-size: 16px;
      font-weight: 900;
      letter-spacing: 0.9px;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      border-bottom: 2px solid #1e3a68;
    }

    .team-tat-stats {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .tat-pill-green {
      background: rgba(16, 185, 129, 0.16);
      border: 1px solid rgba(16, 185, 129, 0.5);
      color: #34d399;
      font-size: 12px;
      font-weight: 800;
      padding: 4px 12px;
      border-radius: 6px;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    .tat-pill-red {
      background: rgba(244, 63, 94, 0.16);
      border: 1px solid rgba(244, 63, 94, 0.5);
      color: #fb7185;
      font-size: 12px;
      font-weight: 800;
      padding: 4px 12px;
      border-radius: 6px;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    .team-badge {
      background: rgba(255, 255, 255, 0.16);
      font-size: 12.5px;
      font-weight: 800;
      padding: 4px 12px;
      border-radius: 5px;
      letter-spacing: 0.5px;
      border: 1px solid rgba(255, 255, 255, 0.18);
    }

    .table-container {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: center;
    }

    thead th {
      background-color: #070e1c !important;
      color: #ffffff !important;
      font-weight: 900;
      font-size: 13.5px;
      letter-spacing: 0.6px;
      padding: 13px 8px;
      border: 1px solid #1a273f;
      white-space: nowrap;
      text-transform: uppercase;
    }

    tbody td {
      padding: 12px 8px;
      border: 1px solid #cbd5e1;
      font-size: 15.5px;
      font-weight: 800;
      font-family: 'JetBrains Mono', monospace;
      white-space: nowrap;
      transition: all 0.15s ease;
    }

    tbody tr:nth-child(even) {
      background-color: #f8fafc;
    }

    tbody tr:hover {
      background-color: #fdf2f8;
    }

    .col-agent-name {
      text-align: center;
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-weight: 800;
      color: #070e1c;
      font-size: 15.5px;
      min-width: 220px;
    }

    .col-region-tag {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 13px;
      font-weight: 800;
      color: #334155;
      min-width: 220px;
      text-align: center;
    }

    .region-pill {
      background: #f1f5f9;
      border: 1px solid #cbd5e1;
      padding: 4px 10px;
      border-radius: 6px;
      display: inline-block;
      line-height: 1.4;
    }

    .cell-val-active {
      font-weight: 900;
      font-size: 16px;
      color: #070e1c;
      background-color: rgba(244, 114, 182, 0.08);
      cursor: pointer;
    }

    .cell-val-active:hover {
      background-color: #f472b6 !important;
      color: #ffffff !important;
      transform: scale(1.05);
      box-shadow: 0 4px 10px rgba(244, 114, 182, 0.4);
    }

    .col-total-summary {
      background-color: #eff6ff !important;
      font-weight: 900;
      font-size: 16.5px;
      color: #1d4ed8;
      min-width: 135px;
      padding: 8px 12px;
      cursor: pointer;
    }

    .spark-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }

    .spark-bar-bg {
      width: 100%;
      height: 6px;
      background-color: #cbd5e1;
      border-radius: 4px;
      overflow: hidden;
    }

    .spark-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, #60a5fa, #1d4ed8);
      border-radius: 4px;
    }

    /* TAT Column with Arrow Indicator Badges */
    .col-tat-summary {
      background-color: #f0fdf4 !important;
      font-weight: 900;
      font-size: 16px;
      color: #15803d;
      min-width: 125px;
    }

    .tat-cell-flex {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .badge-arrow-green {
      background: #dcfce7;
      color: #15803d;
      border: 1px solid #86efac;
      padding: 2px 5px;
      border-radius: 4px;
      font-size: 12px;
      font-weight: 900;
      line-height: 1;
    }

    .badge-arrow-red {
      background: #ffe4e6;
      color: #e11d48;
      border: 1px solid #fca5a5;
      padding: 2px 5px;
      border-radius: 4px;
      font-size: 12px;
      font-weight: 900;
      line-height: 1;
    }

    /* Drilldown Table Section */
    #drilldownSection {
      display: none;
      background: #ffffff;
      border: 2px solid #0f274a;
      border-radius: 14px;
      overflow: hidden;
      margin-top: 30px;
      box-shadow: 0 14px 35px -5px rgba(15, 23, 42, 0.25);
    }

    .drill-header {
      background: linear-gradient(90deg, #070e1c 0%, #1e293b 100%);
      color: #ffffff;
      padding: 16px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid #38bdf8;
    }

    .drill-title {
      font-size: 18px;
      font-weight: 900;
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .drill-badge {
      background: #38bdf8;
      color: #070e1c;
      font-size: 13px;
      font-weight: 900;
      padding: 3px 10px;
      border-radius: 999px;
    }

    .btn-close-drill {
      background: rgba(255, 255, 255, 0.15);
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.3);
      padding: 6px 14px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
    }

    .btn-close-drill:hover {
      background: #ef4444;
      border-color: #ef4444;
    }

    .drill-table th {
      background-color: #0f1e36 !important;
      font-size: 12.5px;
      padding: 11px 8px;
    }

    .drill-table td {
      font-size: 14px;
      padding: 10px 8px;
      font-weight: 700;
    }
  </style>
</head>
<body>

  <div class="container">

    <header class="top-bar">
      <div style="width: 40px;" class="hidden-spacer"></div>

      <div class="header-center-content">
        <div class="luxury-watch-white" title="Live Operations Clock">
          <svg viewBox="0 0 100 100">
            <circle cx="50" cy="50" r="46" stroke="#0f1e36" stroke-width="3.5" fill="#ffffff" />
            <line x1="50" y1="9" x2="50" y2="16" stroke="#0f1e36" stroke-width="3" stroke-linecap="round" />
            <line x1="50" y1="84" x2="50" y2="91" stroke="#0f1e36" stroke-width="3" stroke-linecap="round" />
            <line x1="9" y1="50" x2="16" y2="50" stroke="#0f1e36" stroke-width="3" stroke-linecap="round" />
            <line x1="84" y1="50" x2="91" y2="50" stroke="#0f1e36" stroke-width="3" stroke-linecap="round" />
            <line x1="50" y1="50" x2="68" y2="38" stroke="#0f1e36" stroke-width="4" stroke-linecap="round" />
            <line x1="50" y1="50" x2="50" y2="18" stroke="#1e3a8a" stroke-width="3" stroke-linecap="round" />
            <circle cx="50" cy="50" r="4.5" fill="#0f1e36" />
          </svg>
        </div>
        <h1 class="main-heading">HOURLY KPI CONSULTATION  UNIT II</h1>
      </div>

      <div>
        <label class="btn-file-upload">
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"/>
          </svg>
          <span>Upload CSV File</span>
          <input type="file" id="csvUploader" accept=".csv" style="display: none;">
        </label>
      </div>
    </header>

    <section class="kpi-board">
      <div class="kpi-card-navy card-cyan">
        <div class="kpi-title">Total Consultations</div>
        <div id="statTotal" class="kpi-number">0</div>
      </div>
      <div class="kpi-card-navy card-blue">
        <div class="kpi-title">Average Team TAT</div>
        <div id="statTat" class="kpi-number">0.0 m</div>
      </div>
      <div class="kpi-card-navy card-purple">
        <div class="kpi-title">Active Agents</div>
        <div id="statAgents" class="kpi-number">0 / 27</div>
      </div>
      <div class="kpi-card-navy card-green">
        <div class="kpi-title" style="color: #6ee7b7;">Lowest TAT (Best)</div>
        <div id="statLowestAgent" class="kpi-agent-name text-best-green">--</div>
      </div>
      <div class="kpi-card-navy card-red">
        <div class="kpi-title" style="color: #fda4af;">Highest TAT (Slowest)</div>
        <div id="statHighestAgent" class="kpi-agent-name text-worst-red">--</div>
      </div>
    </section>

    <main id="dashboardHook"></main>

    <section id="drilldownSection">
      <div class="drill-header">
        <div class="drill-title">
          <span id="drillTitleText">CASE BREAKDOWN</span>
          <span id="drillCountBadge" class="drill-badge">0 CASES</span>
        </div>
        <button class="btn-close-drill" onclick="closeDrilldown()">✕ Close Breakdown</button>
      </div>
      <div class="table-container">
        <table class="drill-table">
          <thead>
            <tr>
              <th>#</th>
              <th>EMR #</th>
              <th>DOCTOR NAME</th>
              <th>PHARMACIST / AGENT</th>
              <th>REGION</th>
              <th>BRANCH</th>
              <th>TYPE</th>
              <th style="background-color: #047857 !important;">TAT (MINS)</th>
              <th>APPT TIME</th>
              <th>FEEDBACK END TIME</th>
            </tr>
          </thead>
          <tbody id="drillTableBody"></tbody>
        </table>
      </div>
    </section>

  </div>

  <script>
