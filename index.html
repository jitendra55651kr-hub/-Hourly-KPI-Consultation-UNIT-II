<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HOURLY KPI CONSULTATION  UNIT II</title>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800;900&family=JetBrains+Mono:wght@700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-canvas: #f8fafc;
      --navy-deep: #070e1c;
      --navy-card: #0c182d;
      --navy-card-border: #1e2f4d;
      --pink-glow: rgba(244, 114, 182, 0.22);
      --accent-cyan: #38bdf8;
      --accent-emerald: #10b981;
      --accent-rose: #f43f5e;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    body {
      background-color: var(--bg-canvas);
      background-image: 
        radial-gradient(circle at 50% 50px, var(--pink-glow) 0%, rgba(251, 207, 232, 0.1) 40%, transparent 75%),
        linear-gradient(180deg, #ffffff 0%, #f1f5f9 100%);
      background-attachment: fixed;
      color: #0f172a;
      padding: 24px;
      min-height: 100vh;
    }

    .container {
      max-width: 1840px;
      margin: 0 auto;
    }

    /* Top Command Header Bar */
    .top-bar {
      background: rgba(9, 19, 34, 0.92);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(56, 189, 248, 0.25);
      border-radius: 16px;
      padding: 20px 32px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      box-shadow: 0 10px 30px -5px rgba(244, 114, 182, 0.22), 0 8px 20px rgba(7, 14, 28, 0.4);
      margin-bottom: 24px;
    }

    .header-center-content {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      min-width: 320px;
    }

    .luxury-watch-white {
      width: 52px;
      height: 52px;
      background: #ffffff;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.45), 0 0 0 3px #0f274a;
      flex-shrink: 0;
    }

    .luxury-watch-white svg {
      width: 44px;
      height: 44px;
    }

    .main-heading {
      font-size: 29px;
      font-weight: 900;
      color: #ffffff;
      letter-spacing: 0.5px;
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.4);
    }

    .btn-file-upload {
      background: linear-gradient(135deg, #0f274a 0%, #1e3a8a 100%);
      color: #ffffff;
      padding: 12px 26px;
      font-size: 15px;
      font-weight: 800;
      letter-spacing: 0.4px;
      border-radius: 10px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      border: 1px solid #38bdf8;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.2);
      transition: all 0.25s ease;
      white-space: nowrap;
    }

    .btn-file-upload:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(56, 189, 248, 0.45);
      background: linear-gradient(135deg, #1e3a8a 0%, #2563eb 100%);
      border-color: #7dd3fc;
    }

    .btn-file-upload svg {
      width: 20px;
      height: 20px;
      stroke-width: 2.4;
      color: #38bdf8;
    }

    /* Upload Status Badge */
    #statusBadge {
      display: none;
      background: #0284c7;
      color: #ffffff;
      padding: 6px 16px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 800;
      margin-bottom: 20px;
      text-align: center;
      box-shadow: 0 4px 12px rgba(2, 132, 199, 0.3);
    }

    /* KPI Grid */
    .kpi-board {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 16px;
      margin-bottom: 28px;
    }

    .kpi-card-navy {
      background: linear-gradient(145deg, #091426 0%, #0c1b33 100%);
      border: 1px solid var(--navy-card-border);
      border-radius: 14px;
      padding: 20px 22px;
      box-shadow: 0 8px 20px -4px rgba(7, 14, 28, 0.25);
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: center;
      min-height: 108px;
    }

    .kpi-card-navy::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 5px;
      height: 100%;
    }

    .card-cyan::before { background: var(--accent-cyan); box-shadow: 0 0 10px var(--accent-cyan); }
    .card-blue::before { background: #60a5fa; box-shadow: 0 0 10px #60a5fa; }
    .card-purple::before { background: #c084fc; box-shadow: 0 0 10px #c084fc; }
    .card-green::before { background: var(--accent-emerald); box-shadow: 0 0 12px var(--accent-emerald); }
    .card-red::before { background: var(--accent-rose); box-shadow: 0 0 12px var(--accent-rose); }

    .kpi-title {
      font-size: 12px;
      font-weight: 800;
      color: #cbd5e1;
      text-transform: uppercase;
      letter-spacing: 0.9px;
    }

    .kpi-number {
      font-family: 'JetBrains Mono', monospace;
      font-size: 30px;
      font-weight: 900;
      color: #ffffff;
      margin-top: 6px;
      letter-spacing: -0.5px;
    }

    .kpi-agent-name {
      font-size: 19px;
      font-weight: 900;
      margin-top: 6px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .text-best-green {
      color: #34d399;
      text-shadow: 0 0
